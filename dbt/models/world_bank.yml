version: 2

models:

  - name: stg_world_bank_indicators
    description: Cleaned World Bank indicator observations at country-indicator-year grain.
    columns:
      - name: country_code
        tests:
          - not_null
      - name: indicator_code
        tests:
          - not_null
      - name: year
        tests:
          - not_null

  - name: int_country_economic_year
    description: One row per country and year containing core economic indicators.
    columns:
      - name: country_code
        tests:
          - not_null
      - name: year
        tests:
          - not_null

  - name: mart_country_economic_profile
    description: Analytical country-year model with growth, inflation, trade and rolling economic metrics.
    columns:
      - name: country_code
        tests:
          - not_null
      - name: year
        tests:
          - not_null
